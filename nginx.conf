events {
    worker_connections 256;
}

http {
    upstream dp_api {
        # 轮询两个 API 进程；响应头 X-Worker-Id 可观察请求实际落在哪个进程
        server api-a:8000;
        server api-b:8000;
        keepalive 16;
    }

    server {
        listen 80;
        client_max_body_size 20m;

        location / {
            proxy_pass http://dp_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 180s;
        }
    }
}
